name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL asset ZIP di GitHub Release (API asset URL, bukan browser_download_url)"
        required: true
      tag:
        description: "Tag build"
        required: true
      build_type:
        description: "debug / release"
        required: true
        default: "release"
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

permissions:
  contents: write   # perlu 'write' kalau nanti mau upload hasil APK balik ke Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download ZIP from GitHub Release
        run: |
          echo "=== Downloading ZIP dari: ${{ inputs.zip_url }} ==="

          # PENTING untuk release asset di GitHub API:
          # - Header "Accept: application/octet-stream" WAJIB, kalau tidak GitHub
          #   akan balas metadata JSON, bukan file binernya.
          # - Header Authorization pakai GITHUB_TOKEN bawaan (otomatis tersedia,
          #   tidak perlu bikin secret manual) karena release ada di repo yang sama.
          HTTP_CODE=$(curl -w "%{http_code}" -S -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o project.zip \
            "${{ inputs.zip_url }}")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Gagal download ZIP. Server balas HTTP $HTTP_CODE"
            echo "=== Isi respons (untuk debug) ==="
            cat project.zip
            exit 1
          fi

      - name: Validate ZIP
        run: |
          echo "=== Validating ZIP ==="

          if [ ! -f project.zip ]; then
            echo "❌ File project.zip tidak ditemukan!"
            exit 1
          fi

          FILE_TYPE=$(file --mime-type -b project.zip)
          echo "Detected file type: $FILE_TYPE"

          if [ "$FILE_TYPE" != "application/zip" ]; then
            echo "❌ File bukan ZIP valid! (terdeteksi: $FILE_TYPE)"
            echo "=== Isi file (untuk debug, mungkin JSON error dari GitHub) ==="
            cat project.zip
            exit 1
          fi

          echo "✅ ZIP valid."

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q project.zip -d extracted

          if [ -f "extracted/pubspec.yaml" ]; then
            PROJECT_DIR="extracted"
          else
            PROJECT_DIR=$(find extracted -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan di dalam ZIP. Struktur folder tidak sesuai project Flutter."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project ditemukan di: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Build APK
        if: ${{ inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        if: ${{ inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-${{ inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      # Opsional: kalau bot Telegram kamu ambil hasil APK dengan cara upload
      # ulang ke GitHub Release (bukan lewat artifact), aktifkan step ini
      # dan sesuaikan tag release-nya.
