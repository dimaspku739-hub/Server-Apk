      # - name: Upload APK to Release
      #   if: ${{ inputs.only_analyze != 'true' }}
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: ${{ inputs.tag }}
      #     files: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
